<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المنيو | Lamsa Jana Coffee</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Cormorant+Garamond:ital,wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4ebdc;--card:#fbf6ec;--fg:#2b1f15;--muted:#8a7357;--gold:#b5883f;--bd:rgba(181,136,63,.3);--dark:#171410;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#f4ebdc}}
:root[data-theme="dark"]{--bg:#f4ebdc}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 50% 0,#fbf4e6,var(--bg) 60%);color:var(--fg);font-family:"Almarai",Tahoma,sans-serif;min-height:100vh;padding-bottom:64px;overflow-x:hidden}
.d{font-family:"Cormorant Garamond",Georgia,serif}
button{font:inherit;color:inherit;cursor:pointer}
#drift{position:fixed;inset:0;pointer-events:none;z-index:0}
#drift i{position:absolute;bottom:-40px;width:12px;height:17px;border-radius:50%;background:rgba(95,62,32,.14);animation:up linear infinite}
header,main,.res,footer{position:relative;z-index:1}
header{display:flex;flex-direction:column;align-items:center;padding:20px 20px 0;text-align:center}
.bar{width:100%;max-width:680px;display:flex;justify-content:flex-end}
.lang{background:#fffaf0;border:1px solid var(--bd);color:var(--gold);border-radius:99px;padding:6px 16px;font-size:14px}
.lw{position:relative;margin-top:30px}
.steam{position:absolute;top:-34px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
.steam i{width:6px;height:34px;border-radius:9px;background:rgba(120,90,55,.3);filter:blur(4px);animation:steam 3s ease-out infinite}
.logo{display:block;width:190px;height:190px;border-radius:50%;animation:float 5s ease-in-out infinite,glow 4s ease-in-out infinite}
.tag{margin:20px 0 0;font-size:32px;font-style:italic;background:linear-gradient(90deg,#b5883f,#6b4a22,#b5883f);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
.search{margin-top:20px;width:100%;max-width:680px;border:1px solid var(--bd);background:#fffaf0;color:var(--fg);border-radius:99px;padding:12px 20px;font:inherit;outline:none;transition:.2s}
.search:focus{border-color:var(--gold);box-shadow:0 0 24px rgba(181,136,63,.35)}
main{max-width:680px;margin:28px auto 0;padding:0 14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;animation:fu .6s cubic-bezier(.2,.7,.2,1) both;box-shadow:0 6px 18px rgba(90,60,25,.08)}
.cat.open{grid-column:span 2}
.head{position:relative;width:100%;height:138px;border:0;text-align:start;padding:12px 14px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.head .e{position:absolute;width:58px;height:58px;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.head .e:nth-child(1){top:10px;inset-inline-end:16px}
.head .e:nth-child(2){top:40px;inset-inline-end:76px;width:40px;height:40px;animation-delay:-1.3s;opacity:.85}
.head .e:nth-child(3){top:8px;inset-inline-end:110px;width:30px;height:30px;animation-delay:-2.4s;opacity:.7}
.head h2{margin:0;font-size:21px;position:relative;color:#fbf1de}
.head p{margin:2px 0 0;font-size:12px;color:#f0d49a;position:relative}
ul{list-style:none;margin:0;padding:0}
.cat li,.res li{border-top:1px solid var(--bd);animation:fu .4s ease both}
.row{display:flex;width:100%;align-items:center;gap:12px;padding:10px 12px;background:none;border:0;text-align:start;transition:.15s}
.row:hover,.row:active{background:#f1e4cc}
.tile{flex:none;width:54px;height:54px;border-radius:14px;display:grid;place-items:center;padding:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.row:hover .tile{transform:rotate(-6deg) scale(1.08)}.tile{transition:.2s}
.n{flex:1;line-height:1.35}.s{display:block;font-size:12px;color:var(--muted)}
.price{direction:ltr;font-size:20px;font-weight:700;color:var(--gold);white-space:nowrap}
.res{display:none;max-width:652px;margin:24px auto 0;border:1px solid var(--bd);background:var(--card);border-radius:18px;overflow:hidden}
.res li:first-child{border-top:0}.empty{padding:24px;text-align:center;color:var(--muted)}
footer{margin-top:48px;text-align:center}
footer .d{font-size:24px;font-style:italic;color:var(--gold)}
.adm{margin-top:18px;background:none;border:0;font-size:12px;color:rgba(138,115,87,.7)}
.tools{display:none;justify-content:center;gap:8px;margin-top:10px}.edit .tools{display:flex}
.tools button{background:#fffaf0;border:1px solid var(--bd);border-radius:99px;padding:6px 14px;font-size:13px;color:var(--gold)}
.ed{width:100%;border:1px dashed var(--gold);background:#fffaf0;border-radius:8px;padding:4px 6px;font:inherit;color:var(--fg)}
.ed.p{width:78px;direction:ltr;text-align:center;font-weight:700;color:var(--gold)}
.hid{font-size:11px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:3px}.del{background:none;border:0;font-size:18px}.add{width:100%;padding:10px;border:0;border-top:1px dashed var(--bd);background:#fffaf0;color:var(--gold)}#msg{font-size:12px;color:var(--muted);align-self:center}.tools button:disabled{opacity:.45}.tools{flex-wrap:wrap}
.sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(43,31,21,.5);backdrop-filter:blur(4px)}
.sheet.on{display:flex}
.panel{width:100%;max-width:440px;background:var(--card);border-radius:26px 26px 0 0;text-align:center;padding:36px 24px 32px;position:relative;animation:pop .3s cubic-bezier(.2,.9,.3,1.3) both}
.big{width:130px;height:130px;margin:0 auto;border-radius:50%;display:grid;place-items:center;padding:20px;animation:float 3.5s ease-in-out infinite}
.panel h3{margin:14px 0 0;font-size:28px}.panel .cn{color:var(--gold);font-size:13px;margin:0}
.panel .price{font-size:40px;margin-top:10px}
.x{position:absolute;top:12px;inset-inline-end:12px;width:36px;height:36px;border-radius:50%;border:0;background:#eadcc2}
#splash{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--bg);animation:out 2.8s ease forwards}
#splash img{width:200px;height:200px;border-radius:50%;animation:pop .5s ease both,glow 4s infinite}
.bean{position:absolute;width:16px;height:22px;border-radius:50%;background:#6b4527;box-shadow:inset -3px 0 0 #2a1a0e;animation:burst 2.2s cubic-bezier(.15,.7,.3,1) both}
@keyframes glow{0%,100%{box-shadow:0 0 28px rgba(181,136,63,.3)}50%{box-shadow:0 0 56px rgba(181,136,63,.6)}}
@keyframes float{50%{transform:translateY(-7px)}}
@keyframes steam{0%{opacity:0;transform:translateY(0) scaleX(1)}40%{opacity:.7}100%{opacity:0;transform:translateY(-50px) scaleX(1.6)}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes up{to{transform:translateY(-115vh) rotate(360deg)}}
@keyframes out{0%,70%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes burst{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.2)}30%{opacity:1}100%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--r)) scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
